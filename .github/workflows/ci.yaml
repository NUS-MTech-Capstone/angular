name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: NUS-MTech-Capstone/github-actions-shared/.github/workflows/node-ci.yaml@main
    with:
      node-version: "22"
      test-command: npm test -- --watch=false --coverage --coverage-reporters=lcov
      coverage-lcov-path: coverage/fe/lcov.info
      build-command: npm run build -- --configuration production
