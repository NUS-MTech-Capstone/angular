map $uri $asset_cache_control {
    default "no-store";
    ~*\.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; connect-src 'self' wss://api.ddm.keiyam.me; img-src 'self' data:; font-src 'self' data:; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $asset_cache_control always;

    # Nginx generates a fresh request ID from random bytes for every response.
    # Substitute only the HTML nonce placeholder, matching the CSP header.
    sub_filter '__DDM_CSP_NONCE__' '$request_id';
    sub_filter_once off;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"angular"}';
    }

    location = /readyz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ready","service":"angular"}';
    }

    # Angular SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed assets aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
        access_log off;
    }
}
